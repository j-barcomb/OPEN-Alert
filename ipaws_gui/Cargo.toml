[package]
name    = "ipaws_gui"
version = "0.1.0"
edition = "2021"

[[bin]]
name = "ipaws_alert"
path = "src/main.rs"

[dependencies]
ipaws_core  = { path = "../ipaws_core" }
eframe      = { version = "0.28", features = ["default_fonts"] }
egui        = "0.28"
egui_extras = { version = "0.28", features = ["table"] }
chrono      = { version = "0.4", features = ["serde"] }
serde       = { version = "1",   features = ["derive"] }
serde_json  = "1"
dirs        = "5"
rfd         = "0.14"

[profile.release]
opt-level = 3
lto        = true
strip      = true
